services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: geosoft
      POSTGRES_PASSWORD: geosoft
      POSTGRES_DB: geosoft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geosoft -d geosoft"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./service
    environment:
      DATABASE_URL: postgres://geosoft:geosoft@postgres:5432/geosoft
      API_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api
  collectors:
    build: ./service
    command: sh -c 'while true; do /usr/local/bin/collectors; sleep 3600; done'
    environment:
      DATABASE_URL: postgres://geosoft:geosoft@postgres:5432/geosoft
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
